# Lab 09: Prometheus scrapes Jenkins, Grafana shows the pipeline dashboard.
#   docker compose -f monitoring/docker-compose.yml up -d
# Both join the existing "jenkins" Docker network so Prometheus reaches jenkins:8080.
name: jenkins-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d # long enough for the 7-day SLO window
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [jenkins]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local lab only: viewers can open dashboards without logging in; editing still needs admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [jenkins]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  jenkins:
    external: true
