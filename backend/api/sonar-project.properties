# SonarQube analysis config (Lab 05). Paths are relative to backend/api,
# the directory Jenkins runs sonar-scanner from.
sonar.projectKey=taskflow-api
sonar.projectName=taskflow-api
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# SonarQube 9.9 cannot parse tsconfig.json (TypeScript 6 options); see tsconfig.sonar.json
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# lcov.info is produced by `npm run test:cov` in the Unit Test stage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage counts only the modules that have unit tests, the same scope as
# vitest.config.ts. Every other file is still analysed for bugs and code smells,
# but is left out of the coverage figure the 70% Quality Gate checks.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app.*.ts,\
  src/admin/**,\
  src/auth/**,\
  src/chat/**,\
  src/config/**,\
  src/database/**,\
  src/devices/**,\
  src/media/**,\
  src/moderation/**,\
  src/traits/**,\
  src/users/**,\
  src/pets/dto/**,\
  src/pets/pets.*.ts,\
  src/common/app-exception.ts,\
  src/common/current-user.decorator.ts,\
  src/common/http-exception.filter.ts,\
  src/common/jwt-auth.guard.ts,\
  src/common/public.decorator.ts
